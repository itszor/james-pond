; libroger's settings for jamespond (beside it, as <program>.ini)

[crop]
; --crop: the rows of the 256-line screen to show (FIRST-LAST, or all),
; to start with and from when the code at an address first runs (in hex)

; LOADER's Krisalis logo fills the screen
rows = all
; JamesCode, from its start (unpacked to &B000): the intro and the title
; use rows 0-201, the game 0-197 (play area and status panel); black below
B000 = 0-201
